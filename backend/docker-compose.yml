services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      POSTGRES_DB: ${DB_NAME:-refer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-refer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - refer_network

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:?DB_PASSWORD requerido}@postgres:5432/kratos?sslmode=disable
    command: ["migrate", "sql", "-e", "--yes"]
    networks:
      - refer_network

  kratos:
    image: oryd/kratos:v26.2.0
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:?DB_PASSWORD requerido}@postgres:5432/kratos?sslmode=disable
      SECRETS_CIPHER_0: ${KRATOS_SECRETS_CIPHER:?KRATOS_SECRETS_CIPHER requerido (openssl rand -hex 16)}
      SECRETS_COOKIE_0: ${KRATOS_SECRETS_COOKIE:?KRATOS_SECRETS_COOKIE requerido (openssl rand -hex 32)}
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_URI:-smtp://localhost:1025/}
    volumes:
      - ./kratos/kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["serve", "all", "--watch-courier", "--config", "/etc/config/kratos/kratos.yml"]
    ports:
      - "127.0.0.1:${KRATOS_PUBLIC_PORT:-4433}:4433"
      - "127.0.0.1:${KRATOS_ADMIN_PORT:-4434}:4434"
    networks:
      - refer_network

  app:
    image: ${APP_IMAGE:-refer-api}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kratos:
        condition: service_started
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      DB_NAME: ${DB_NAME:-refer}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DATABASE_URL: ${DATABASE_URL:-}
      KRATOS_PUBLIC_URL: ${KRATOS_PUBLIC_URL:-http://kratos:4433}
      KRATOS_ADMIN_URL: ${KRATOS_ADMIN_URL:-http://kratos:4434}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET requerido (openssl rand -base64 48)}
      AUTH_JWT_EXP_SEC: ${AUTH_JWT_EXP_SEC:-3600}
      AUTH_REFRESH_TTL_DAYS: ${AUTH_REFRESH_TTL_DAYS:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123@}
      SMTP_ENABLED: ${SMTP_ENABLED:-}
      SIGNUP_EMAIL_ENABLED: ${SIGNUP_EMAIL_ENABLED:-}
      RECOVERY_EMAIL_ENABLED: ${RECOVERY_EMAIL_ENABLED:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_UPLOADS_URL: ${R2_PUBLIC_UPLOADS_URL:-}
      R2_PUBLIC_PRODUCTS_URL: ${R2_PUBLIC_PRODUCTS_URL:-}
      R2_PUBLIC_AVATARS_URL: ${R2_PUBLIC_AVATARS_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_MIN_VERSION: ${APP_MIN_VERSION:-1.0.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - refer_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  refer_network:
    driver: bridge
