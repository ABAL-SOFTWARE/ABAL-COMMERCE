services:
  web:
    image: ${APP_IMAGE:-ghcr.io/cobyzero/refer-web}:${APP_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-4200}:80"
    env_file:
      - path: .env
        required: false
    environment:
      APP_BACKEND_URL: ${APP_BACKEND_URL:-http://localhost:3001}
      APP_API_PATH: ${APP_API_PATH:-/api/v1}
      APP_API_URL: ${APP_API_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
